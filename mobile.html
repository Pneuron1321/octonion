<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>OCTONION</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#aaccff;
user-select:none;-webkit-user-select:none;touch-action:none;position:fixed;width:100%;height:100%}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}

/* HUD */
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;
font-size:11px;line-height:1.6;pointer-events:none;opacity:0;transition:opacity 1.5s;
text-shadow:0 0 8px rgba(80,140,255,0.3)}
.v{color:#dde8ff}.l{color:#3a5a7a}.hi{color:#ffd644}

/* Score */
#sbox{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;
text-align:right;pointer-events:none;opacity:0;transition:opacity 1.5s}
.sv{font-size:26px;color:#fff;text-shadow:0 0 14px rgba(80,140,255,0.3)}
.sl{font-size:9px;color:#3a5a7a;letter-spacing:2px}
.sn{font-size:13px;color:#6688aa;letter-spacing:2px;margin-top:2px}
#streak{font-size:10px;color:#4a6a8a;margin-top:4px}

/* Coherence bar */
#cbar{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;
transform:translateX(-50%);width:220px;height:3px;
background:rgba(255,255,255,0.06);border-radius:2px;opacity:0;transition:opacity 1s}
#cfill{height:100%;width:0%;border-radius:2px;transition:width 0.2s;
background:linear-gradient(90deg,#ff3030,#bb44ff,#4499ff,#eef)}

/* Level notification */
#lvl-notify{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
font-size:28px;letter-spacing:8px;color:rgba(255,255,255,0);
pointer-events:none;transition:none;text-shadow:0 0 30px rgba(100,160,255,0.5);
font-weight:300}
#lvl-desc{position:fixed;top:calc(50% + 36px);left:50%;transform:translateX(-50%);
font-size:11px;letter-spacing:2px;color:rgba(120,160,220,0);
pointer-events:none;text-align:center;max-width:280px;line-height:1.5}

/* Breathing label */
#breath-label{position:fixed;top:calc(50% - 85px);left:50%;transform:translateX(-50%);
font-size:12px;letter-spacing:4px;color:rgba(100,170,255,0);
pointer-events:none;transition:color 0.8s}

/* Equations */
#eq{position:fixed;bottom:max(34px,calc(env(safe-area-inset-bottom) + 18px));
left:50%;transform:translateX(-50%);text-align:center;font-size:10px;
color:rgba(255,255,255,0);transition:color 2s;pointer-events:none;
white-space:nowrap;text-shadow:0 0 10px rgba(80,140,255,0.2)}

/* Intro */
#intro{position:fixed;top:0;left:0;width:100%;height:100%;
display:flex;flex-direction:column;align-items:center;justify-content:center;
background:radial-gradient(ellipse at center,#060618 0%,#000 70%);z-index:100;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#intro h1{font-size:40px;letter-spacing:18px;color:#8aaacc;
text-shadow:0 0 35px rgba(80,130,220,0.3);margin-bottom:6px;font-weight:300}
.sub{font-size:10px;color:#2a4560;letter-spacing:5px;margin-bottom:40px}
.desc{font-size:12px;color:#3a5a7a;text-align:center;line-height:1.8;
max-width:300px;margin-bottom:40px;letter-spacing:0.5px}
.btn{font-size:15px;color:#4499cc;letter-spacing:3px;
border:1px solid rgba(68,150,200,0.25);padding:16px 40px;
background:transparent;font-family:inherit;border-radius:4px;-webkit-appearance:none}
.btn:active{background:rgba(68,150,200,0.1);border-color:rgba(68,150,200,0.5)}
.hint{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));
font-size:9px;color:#1a3040;text-align:center;padding:0 20px}

/* Controls */
#mode-btn{position:fixed;bottom:max(48px,calc(env(safe-area-inset-bottom) + 32px));
right:14px;font-size:9px;color:#3a5a7a;letter-spacing:1px;
border:1px solid rgba(60,90,120,0.25);padding:7px 10px;
background:rgba(0,0,0,0.6);font-family:inherit;border-radius:4px;
z-index:10;display:none;-webkit-appearance:none}
#mode-btn:active{background:rgba(68,150,200,0.1)}
#touch-zone{position:fixed;bottom:max(80px,calc(env(safe-area-inset-bottom) + 60px));
left:50%;transform:translateX(-50%);width:280px;height:48px;
border-radius:24px;background:rgba(255,255,255,0.03);
border:1px solid rgba(80,130,200,0.12);display:none;z-index:10}
#touch-fill{position:absolute;left:0;top:0;bottom:0;width:16.7%;
border-radius:24px;background:linear-gradient(90deg,rgba(255,50,50,0.15),rgba(100,50,200,0.15),rgba(50,150,255,0.25))}
#touch-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
font-size:14px;color:rgba(150,180,220,0.5);pointer-events:none}
#touch-45{position:absolute;top:0;bottom:0;left:41.7%;width:2px;
background:rgba(255,215,0,0.25);pointer-events:none}

/* Flash overlay */
#flash{position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(180,200,255,0);pointer-events:none;transition:background 0.1s;z-index:50}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="hud">
    <div><span class="l">theta </span><span class="v" id="ht">--</span><span class="l"> deg</span></div>
    <div><span class="l">chi^2 </span><span class="v" id="hc">--</span></div>
    <div><span class="l">epsilon </span><span class="v" id="he">--</span></div>
    <div style="margin-top:6px"><span class="l">coherence </span><span class="v hi" id="ho">--</span></div>
</div>

<div id="sbox">
    <div class="sl">RESONANCE</div>
    <div class="sv" id="sv">0</div>
    <div class="sn" id="sn">CHAOS</div>
    <div id="streak"></div>
</div>

<div id="cbar"><div id="cfill"></div></div>
<div id="breath-label"></div>
<div id="lvl-notify"></div>
<div id="lvl-desc"></div>
<div id="eq"></div>

<button id="mode-btn">MANUAL</button>
<div id="touch-zone">
    <div id="touch-fill"></div>
    <div id="touch-45"></div>
    <div id="touch-label">slide to 45</div>
</div>

<div id="intro">
    <h1>OCTONION</h1>
    <div class="sub">THE LIVING THEORY</div>
    <div class="desc">
        Real modular forms from particle physics.<br>
        Your breathing controls tau on the unit circle.<br>
        Match the rhythm. Crystallize the universe.
    </div>
    <button class="btn" id="go">BEGIN</button>
    <div class="hint">breathe with the guide ring | or tap MANUAL</div>
</div>

<script>
// =========================================================
//  OCTONION v2 — Mobile
//  G2 -> PSL(2,7) -> Z7 -> chi^2 -> visual coherence
//  Breathing guide, level-ups, haptic, rotating geometry
// =========================================================

const PI=Math.PI, TAU=2*PI, S14=Math.sin(PI/14);

// --- MODULAR FORMS ---
function theta7r(r,td){
    const th=td*PI/180,c=Math.cos(th),s=Math.sin(th);
    let re=0,im=0;
    for(let n=-6;n<=6;n++){const m=7*n+r,e=m*m/14,d=Math.exp(-TAU*s*e),ph=TAU*c*e;
    re+=d*Math.cos(ph);im+=d*Math.sin(ph);}return[re,im];}
const cSq=z=>[z[0]*z[0]-z[1]*z[1],2*z[0]*z[1]];
const cAdd=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const cAbs=z=>Math.sqrt(z[0]*z[0]+z[1]*z[1]);

function chi2at(td){
    const t=[];for(let r=0;r<7;r++)t.push(theta7r(r,td));
    const Y1=cAdd(cSq(t[1]),cSq(t[6])),Y2=cAdd(cSq(t[2]),cSq(t[5]));
    const eps=cAbs(Y2)/cAbs(Y1),vN=S14*(1+0.494*eps*eps),vC=(6/7)*S14*S14;
    let c2=0;for(const[p,e,s]of[[eps*eps,.02234,.0004],[eps**1.5,.05946,.0005],
    [vN,.225,.00067],[vC,.0422,.0008],[Math.sqrt(eps**1.575),.225,.001]]){const d=(p-e)/s;c2+=d*d;}
    return{chi2:c2,epsilon:eps};}

const LUT=[];let c2Min=1e9,c2Max=0;
for(let i=0;i<=120;i++){const th=20+i*.5,r=chi2at(th);LUT.push(r);
if(r.chi2<c2Min)c2Min=r.chi2;if(r.chi2>c2Max)c2Max=r.chi2;}
const lnMin=Math.log(c2Min+1),lnMax=Math.log(c2Max+1);
function lookup(th){const idx=(th-20)/.5,i=Math.max(0,Math.min(119,idx|0)),f=idx-i;
const a=LUT[i],b=LUT[Math.min(120,i+1)];
return{chi2:a.chi2+f*(b.chi2-a.chi2),epsilon:a.epsilon+f*(b.epsilon-a.epsilon)};}

// --- AUDIO ---
let actx,analyser,adata,micOn=false;
let ampH=[],pks=[],bPer=10,sAmp=0,lPk=0,inhaling=false;
let manual=false,manTh=30;

async function initMic(){try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    actx=new(window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaStreamSource(st);analyser=actx.createAnalyser();
    analyser.fftSize=1024;analyser.smoothingTimeConstant=.85;
    src.connect(analyser);adata=new Uint8Array(1024);micOn=true;
    if(actx.state==='suspended')actx.resume();
}catch(e){manual=true;showManual();}}

function getRms(){if(!micOn)return 0;analyser.getByteTimeDomainData(adata);
let s=0;for(let i=0;i<adata.length;i++){const v=(adata[i]-128)/128;s+=v*v;}
return Math.sqrt(s/adata.length);}

function detectBreath(t){if(manual)return;const a=getRms();
sAmp=sAmp*.92+a*.08;ampH.push({t,a:sAmp});
while(ampH.length&&ampH[0].t<t-30000)ampH.shift();
if(ampH.length<20)return;
const rec=ampH.slice(-10),old=ampH.slice(-20,-10);
const ar=rec.reduce((s,v)=>s+v.a,0)/rec.length;
const ao=old.reduce((s,v)=>s+v.a,0)/old.length;
if(ar>ao*1.12&&!inhaling&&t-lPk>3000){inhaling=true;
if(lPk>0){const p=(t-lPk)/1000;if(p>4&&p<30){pks.push(p);if(pks.length>5)pks.shift();
bPer=pks.reduce((a,b)=>a+b,0)/pks.length;}}lPk=t;}
if(ar<ao*.92)inhaling=false;}
function getTheta(){return manual?manTh:Math.max(20,Math.min(80,630/bPer));}

// --- TONES (richer: fundamental + 5th + octave, with shimmer) ---
let gains=[];
function initTones(){
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const freqs=[130.8,196.0,261.6,392.0,523.3]; // C3,G3,C4,G4,C5
    for(const f of freqs){
        const o=actx.createOscillator(),g=actx.createGain();
        o.type='sine';o.frequency.value=f;g.gain.value=0;
        o.connect(g);g.connect(actx.destination);o.start();gains.push(g);}
}
function updTones(coh){if(!gains.length)return;
    const vol=coh*coh*0.025;
    for(let i=0;i<gains.length;i++){
        const thr=i*0.15;
        const v=Math.max(0,coh-thr)*vol*(1-i*0.12);
        gains[i].gain.setTargetAtTime(v,actx.currentTime,0.2);}}

// --- PARTICLE SPRITE (pre-rendered soft circle) ---
let sprite;
function makeSprite(){
    const s=document.createElement('canvas');
    s.width=32;s.height=32;const c=s.getContext('2d');
    const g=c.createRadialGradient(16,16,0,16,16,16);
    g.addColorStop(0,'rgba(255,255,255,0.8)');
    g.addColorStop(0.3,'rgba(200,220,255,0.3)');
    g.addColorStop(1,'rgba(100,150,255,0)');
    c.fillStyle=g;c.fillRect(0,0,32,32);
    sprite=s;}

// --- PARTICLES ---
const NP=300;let P=[];
function initP(w,h){P=[];const cx=w/2,cy=h/2;
for(let i=0;i<NP;i++)P.push({
    x:cx+(Math.random()-.5)*w*.9,y:cy+(Math.random()-.5)*h*.9,
    vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,
    sz:.7+Math.random()*1.6,tr:[],tx:0,ty:0,hue:0,gen:i%3});
buildTgt(w,h);}

function buildTgt(w,h){
    const cx=w/2,cy=h/2,sc=Math.min(w,h)*.35,tgt=[[cx,cy]];
    for(let k=0;k<7;k++){const a=k/7*TAU-PI/2;tgt.push([cx+Math.cos(a)*sc*.22,cy+Math.sin(a)*sc*.22]);}
    for(let g=0;g<3;g++)for(let k=0;k<7;k++){const a=(k/7+g/21)*TAU-PI/2;tgt.push([cx+Math.cos(a)*sc*.52,cy+Math.sin(a)*sc*.52]);}
    for(let k=0;k<42;k++){const a=k/42*TAU-PI/2;tgt.push([cx+Math.cos(a)*sc*.78,cy+Math.sin(a)*sc*.78]);}
    for(let k=0;k<42;k++){const a=k/42*TAU-PI/2;tgt.push([cx+Math.cos(a)*sc*.98,cy+Math.sin(a)*sc*.98]);}
    for(let i=0;i<P.length;i++){const t=tgt[i%tgt.length];
    P[i].tx=t[0]+(Math.random()-.5)*10;P[i].ty=t[1]+(Math.random()-.5)*10;}}

function stepP(coh,w,h){
    const cx=w/2,cy=h/2,ch=1-coh;
    for(const p of P){
        p.vx+=(Math.random()-.5)*ch*2.2;p.vy+=(Math.random()-.5)*ch*2.2;
        const f=coh*coh*.045;
        p.vx+=(p.tx-p.x)*f;p.vy+=(p.ty-p.y)*f;
        p.vx+=(cx-p.x)*.00006*ch;p.vy+=(cy-p.y)*.00006*ch;
        p.vx*=.93;p.vy*=.93;p.x+=p.vx;p.y+=p.vy;
        if(p.x<0){p.x=0;p.vx*=-.3;}if(p.x>w){p.x=w;p.vx*=-.3;}
        if(p.y<0){p.y=0;p.vy*=-.3;}if(p.y>h){p.y=h;p.vy*=-.3;}
        p.tr.push([p.x,p.y]);while(p.tr.length>3+Math.floor(coh*12))p.tr.shift();
        p.hue=ch*8+coh*218;}}

// --- RENDERER ---
let cvs,ctx,dpr;
function initC(){cvs=document.getElementById('c');ctx=cvs.getContext('2d');
dpr=Math.min(window.devicePixelRatio||1,2);doResize();
window.addEventListener('resize',doResize);}
function doResize(){const w=window.innerWidth,h=window.innerHeight;
cvs.width=w*dpr;cvs.height=h*dpr;cvs.style.width=w+'px';cvs.style.height=h+'px';
ctx.setTransform(dpr,0,0,dpr,0,0);if(P.length)buildTgt(w,h);}
function gW(){return cvs.width/dpr;}function gH(){return cvs.height/dpr;}

// Rotation angles for geometry rings
let rotInner=0, rotMid=0, rotOuter=0, rotSpoke=0;

function draw(coh,theta,chi2,eps,t){
    const w=gW(),h=gH(),cx=w/2,cy=h/2,sc=Math.min(w,h)*.35;

    // update rotations
    const dt=0.016;
    rotInner+=dt*coh*0.3;
    rotMid+=dt*coh*0.15;
    rotOuter+=dt*coh*0.08;
    rotSpoke+=dt*coh*0.05;

    // --- background with subtle gradient ---
    const bgR=6+(1-coh)*12|0, bgG=3+coh*10|0, bgB=12+coh*28|0;
    ctx.fillStyle=`rgb(${bgR},${bgG},${bgB})`;
    ctx.fillRect(0,0,w,h);

    // nebula blobs (3 large soft circles, very cheap)
    if(coh>0.15){
        ctx.globalCompositeOperation='lighter';
        const na=(coh-.15)*.06;
        const nebulae=[
            [cx-sc*.4,cy-sc*.3,sc*.6,`rgba(40,20,80,${na})`],
            [cx+sc*.3,cy+sc*.2,sc*.5,`rgba(20,40,80,${na})`],
            [cx,cy,sc*.8,`rgba(30,30,60,${na*.5})`]
        ];
        for(const[nx,ny,nr,nc]of nebulae){
            const g=ctx.createRadialGradient(nx,ny,0,nx,ny,nr);
            g.addColorStop(0,nc);g.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=g;ctx.fillRect(nx-nr,ny-nr,nr*2,nr*2);}
        ctx.globalCompositeOperation='source-over';
    }

    // stars (twinkling)
    if(coh>0.1){
        const sa=(coh-.1)*.35;
        for(let i=0;i<60;i++){
            const sx=(i*7919+37)%w,sy=(i*6271+53)%h;
            const tw=.3+.7*(.5+.5*Math.sin(t*.001+i*2.3));
            ctx.fillStyle=`rgba(220,230,255,${sa*tw})`;
            const ss=.5+tw*.8;
            ctx.fillRect(sx,sy,ss,ss);
        }
    }

    // === BREATHING GUIDE (the main UX element) ===
    const breathCycle=14000; // 14s full cycle
    const phase=(t%breathCycle)/breathCycle; // 0..1
    const isInhalePhase=phase<0.5;
    const phaseInHalf=isInhalePhase?phase*2:(phase-.5)*2; // 0..1 within half

    // Smooth sine curve for guide radius
    const guideR=sc*.12+sc*.12*Math.sin((phase-.25)*TAU); // expands 0..0.5, contracts 0.5..1
    const guideAlpha=.08+coh*.12;

    // Guide ring
    ctx.strokeStyle=`rgba(100,180,255,${guideAlpha})`;
    ctx.lineWidth=1.5+coh;
    ctx.beginPath();ctx.arc(cx,cy,guideR,0,TAU);ctx.stroke();

    // Second guide ring (echo, delayed)
    if(coh>0.3){
        const ga2=(coh-.3)*.06;
        const gr2=guideR*1.15;
        ctx.strokeStyle=`rgba(80,140,220,${ga2})`;
        ctx.lineWidth=.5;
        ctx.beginPath();ctx.arc(cx,cy,gr2,0,TAU);ctx.stroke();
    }

    // Breathing label
    const bl=document.getElementById('breath-label');
    if(!manual){
        bl.style.color=`rgba(100,170,255,${.15+coh*.2})`;
        bl.textContent=isInhalePhase?'INHALE':'EXHALE';
    } else {
        bl.style.color='rgba(100,170,255,0)';
    }

    // === GEOMETRY (rotating) ===
    if(coh>0.12){
        const la=(coh-.12)*.5;

        // Z7 heptagon (inner, rotates)
        ctx.strokeStyle=`rgba(60,150,230,${la})`;
        ctx.lineWidth=.6+coh*1.5;
        ctx.beginPath();
        for(let k=0;k<=7;k++){
            const a=k/7*TAU-PI/2+rotInner;
            const x=cx+Math.cos(a)*sc*.22,y=cy+Math.sin(a)*sc*.22;
            k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
        ctx.closePath();ctx.stroke();

        // Heptagram {7/2} (star)
        if(coh>0.3){
            ctx.strokeStyle=`rgba(140,80,240,${(coh-.3)*.4})`;
            ctx.lineWidth=.5+coh;
            ctx.beginPath();
            for(let k=0;k<=7;k++){
                const a=(k*2%7)/7*TAU-PI/2+rotInner;
                const x=cx+Math.cos(a)*sc*.22,y=cy+Math.sin(a)*sc*.22;
                k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
            ctx.closePath();ctx.stroke();}

        // Heptagram {7/3} (deeper star)
        if(coh>0.5){
            ctx.strokeStyle=`rgba(200,120,255,${(coh-.5)*.25})`;
            ctx.lineWidth=.4+coh*.5;
            ctx.beginPath();
            for(let k=0;k<=7;k++){
                const a=(k*3%7)/7*TAU-PI/2+rotInner;
                const x=cx+Math.cos(a)*sc*.22,y=cy+Math.sin(a)*sc*.22;
                k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
            ctx.closePath();ctx.stroke();}

        // 21-gon (three generations)
        if(coh>0.35){
            const la3=(coh-.35)*.3;
            ctx.lineWidth=.4+coh*.6;
            // Three separate heptagons for 3 generations, different colors
            const genColors=['rgba(80,180,255,','rgba(180,100,255,','rgba(255,180,80,'];
            for(let g=0;g<3;g++){
                ctx.strokeStyle=genColors[g]+la3+')';
                ctx.beginPath();
                for(let k=0;k<=7;k++){
                    const a=(k/7+g/21)*TAU-PI/2+rotMid;
                    const x=cx+Math.cos(a)*sc*.52,y=cy+Math.sin(a)*sc*.52;
                    k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
                ctx.closePath();ctx.stroke();}}

        // Outer 42-gon (PSL(2,7))
        if(coh>0.55){
            ctx.strokeStyle=`rgba(220,200,80,${(coh-.55)*.3})`;
            ctx.lineWidth=.3+coh*.5;
            ctx.beginPath();
            for(let k=0;k<=42;k++){
                const a=k/42*TAU-PI/2+rotOuter;
                const x=cx+Math.cos(a)*sc*.78,y=cy+Math.sin(a)*sc*.78;
                k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
            ctx.closePath();ctx.stroke();}

        // Radial spokes (7, rotating)
        if(coh>0.45){
            const rl=(coh-.45)*.2;
            ctx.strokeStyle=`rgba(80,130,220,${rl})`;
            ctx.lineWidth=.5;
            for(let k=0;k<7;k++){
                const a=k/7*TAU-PI/2+rotSpoke;
                ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*sc*.1,cy+Math.sin(a)*sc*.1);
                ctx.lineTo(cx+Math.cos(a)*sc*.78,cy+Math.sin(a)*sc*.78);ctx.stroke();}}

        // Vertex dots on inner heptagon
        if(coh>0.4){
            const va=(coh-.4)*.6;
            for(let k=0;k<7;k++){
                const a=k/7*TAU-PI/2+rotInner;
                const x=cx+Math.cos(a)*sc*.22,y=cy+Math.sin(a)*sc*.22;
                const pulse=.5+.5*Math.sin(t*.003+k);
                ctx.fillStyle=`rgba(150,200,255,${va*pulse})`;
                ctx.beginPath();ctx.arc(x,y,2+coh*2,0,TAU);ctx.fill();}}

        // Outermost ring (168 = |PSL(2,7)|)
        if(coh>0.75){
            const la5=(coh-.75)*.15;
            ctx.strokeStyle=`rgba(220,230,255,${la5})`;
            ctx.lineWidth=.3;
            ctx.beginPath();
            for(let k=0;k<=168;k++){
                const a=k/168*TAU+rotOuter*.5;
                const x=cx+Math.cos(a)*sc*.98,y=cy+Math.sin(a)*sc*.98;
                k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
            ctx.closePath();ctx.stroke();}
    }

    // --- Particle trails ---
    if(coh>0.08){
        ctx.lineWidth=.7;
        for(const p of P){if(p.tr.length<2)continue;
        const a=.05+coh*.15;
        const sat=70-coh*30,lit=40+coh*45;
        ctx.strokeStyle=`hsla(${p.hue},${sat}%,${lit}%,${a})`;
        ctx.beginPath();ctx.moveTo(p.tr[0][0],p.tr[0][1]);
        for(let i=1;i<p.tr.length;i++)ctx.lineTo(p.tr[i][0],p.tr[i][1]);
        ctx.stroke();}}

    // --- Particles (sprite-based glow + core) ---
    // Glow pass (additive)
    ctx.globalCompositeOperation='lighter';
    const glowA=.03+coh*.1;
    ctx.globalAlpha=glowA;
    for(const p of P){
        const sz=p.sz*(1.5+coh*3);
        ctx.drawImage(sprite,p.x-sz,p.y-sz,sz*2,sz*2);}
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';

    // Core dots
    for(const p of P){
        const sz=p.sz*(.8+coh*2);
        const sat=70-coh*35,lit=45+coh*50;
        ctx.fillStyle=`hsla(${p.hue},${sat}%,${lit}%,${.4+coh*.6})`;
        ctx.beginPath();ctx.arc(p.x,p.y,sz,0,TAU);ctx.fill();}

    // --- Central glow ---
    if(coh>0.2){
        const ga=(coh-.2)*.35;
        const r=30+coh*100+Math.sin(t*.002)*15*coh;
        const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
        grd.addColorStop(0,`rgba(200,220,255,${ga})`);
        grd.addColorStop(.4,`rgba(80,130,255,${ga*.4})`);
        grd.addColorStop(1,'rgba(30,50,150,0)');
        ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();}

    // Peak burst
    if(coh>.9){
        const ba=(coh-.9)*3;
        ctx.globalCompositeOperation='lighter';
        const br=sc*1.1;
        const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,br);
        grd.addColorStop(0,`rgba(255,250,240,${ba*.12})`);
        grd.addColorStop(1,'rgba(255,250,240,0)');
        ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx,cy,br,0,TAU);ctx.fill();
        ctx.globalCompositeOperation='source-over';}

    // --- Unit circle indicator ---
    const ur=20,ux=w-36,uy=h-70;
    ctx.strokeStyle='rgba(70,120,180,.15)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(ux,uy,ur,0,TAU);ctx.stroke();
    const tRad=theta*PI/180;
    ctx.fillStyle=coh>.7?'#ffd644':'#4499cc';
    ctx.beginPath();ctx.arc(ux+Math.cos(tRad)*ur,uy-Math.sin(tRad)*ur,2.5,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,215,0,.2)';
    ctx.beginPath();ctx.arc(ux+Math.cos(PI/4)*ur,uy-Math.sin(PI/4)*ur,1.5,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(70,110,160,.3)';ctx.font='8px Courier New';
    ctx.fillText('tau',ux-8,uy+ur+10);

    // --- Equations ---
    const eq=document.getElementById('eq');
    if(coh>.55){
        eq.style.color=`rgba(160,190,255,${Math.min(1,(coh-.55)*2)*.45})`;
        eq.textContent=coh>.82
            ?'cos(4\u03C0/7) = \u2212sin(\u03C0/14)  \u2502  G\u2082 = Aut(\uD835\uDD46)  \u2502  168 = |PSL(2,7)|'
            :'eps = '+eps.toFixed(3)+'  \u2502  \u03C7\u00B2 = '+chi2.toFixed(1);
    } else eq.style.color='rgba(0,0,0,0)';
}

// --- GAME STATE ---
let score=0,level='CHAOS',prevLevel='',running=false,streakSec=0;
const LVL=[
    [0,'CHAOS','entropy reigns'],
    [.12,'FLUCTUATION','quantum noise stirs'],
    [.25,'EMERGENCE','patterns form in chaos'],
    [.40,'STRUCTURE','Z\u2087 symmetry appears'],
    [.55,'SYMMETRY','three generations emerge'],
    [.70,'COHERENCE','PSL(2,7) crystallizes'],
    [.85,'RESONANCE','chi\u00B2 approaches minimum'],
    [.94,'G\u2082','cos(4\u03C0/7) = \u2212sin(\u03C0/14)']
];

function gameStep(coh,dt){
    if(coh>.55){streakSec+=dt;score+=coh*dt*14;}
    else streakSec=Math.max(0,streakSec-dt*.5);

    let newLevel='CHAOS',desc='';
    for(let i=LVL.length-1;i>=0;i--)
        if(coh>=LVL[i][0]){newLevel=LVL[i][1];desc=LVL[i][2];break;}

    if(newLevel!==prevLevel&&prevLevel!==''){
        // Level transition!
        const notify=document.getElementById('lvl-notify');
        const descEl=document.getElementById('lvl-desc');
        notify.textContent=newLevel;
        notify.style.color='rgba(220,230,255,0.9)';
        descEl.textContent=desc;
        descEl.style.color='rgba(120,160,220,0.6)';

        // Flash
        const flash=document.getElementById('flash');
        flash.style.transition='none';
        flash.style.background='rgba(180,200,255,0.12)';
        setTimeout(()=>{flash.style.transition='background 1.5s';flash.style.background='rgba(0,0,0,0)';},50);

        // Haptic
        if(navigator.vibrate)navigator.vibrate(40);

        // Fade out notification
        setTimeout(()=>{
            notify.style.transition='color 2s';notify.style.color='rgba(255,255,255,0)';
            descEl.style.transition='color 2s';descEl.style.color='rgba(0,0,0,0)';
            setTimeout(()=>{notify.style.transition='none';descEl.style.transition='none';},2100);
        },1800);
    }
    prevLevel=newLevel;level=newLevel;

    // Streak display
    const streakEl=document.getElementById('streak');
    if(streakSec>1)streakEl.textContent=Math.floor(streakSec)+'s in flow';
    else streakEl.textContent='';
}

// --- MAIN LOOP ---
let lastT=0,sCoh=0;
function loop(t){
    if(!running){requestAnimationFrame(loop);return;}
    const dt=Math.min((t-lastT)/1000,.1);lastT=t;
    detectBreath(t);
    const theta=getTheta();
    const{chi2,epsilon}=lookup(theta);
    const raw=1-(Math.log(chi2+1)-lnMin)/(lnMax-lnMin);
    const coh=Math.max(0,Math.min(1,raw));
    sCoh+=(coh-sCoh)*.07;

    stepP(sCoh,gW(),gH());
    gameStep(sCoh,dt);
    updTones(sCoh);
    draw(sCoh,theta,chi2,epsilon,t);

    document.getElementById('ht').textContent=theta.toFixed(1);
    document.getElementById('hc').textContent=chi2.toFixed(0);
    document.getElementById('he').textContent=epsilon.toFixed(3);
    document.getElementById('ho').textContent=(sCoh*100|0)+'%';
    document.getElementById('cfill').style.width=(sCoh*100)+'%';
    document.getElementById('sv').textContent=score|0;
    document.getElementById('sn').textContent=level;
    requestAnimationFrame(loop);}

// --- TOUCH ---
function showManual(){document.getElementById('touch-zone').style.display='block';
document.getElementById('mode-btn').textContent='MIC';}
function hideManual(){document.getElementById('touch-zone').style.display='none';
document.getElementById('mode-btn').textContent='MANUAL';}

const tz=document.getElementById('touch-zone');
function handleTouch(e){if(!manual)return;e.preventDefault();
const rect=tz.getBoundingClientRect();const touch=e.touches?e.touches[0]:e;
const x=Math.max(0,Math.min(1,(touch.clientX-rect.left)/rect.width));
manTh=20+x*60;
document.getElementById('touch-fill').style.width=(x*100)+'%';
document.getElementById('touch-label').textContent=manTh.toFixed(0)+'\u00B0';}
tz.addEventListener('touchstart',handleTouch,{passive:false});
tz.addEventListener('touchmove',handleTouch,{passive:false});
document.getElementById('mode-btn').addEventListener('click',()=>{
manual=!manual;if(manual)showManual();else hideManual();});

// --- INIT ---
function start(){
    document.getElementById('intro').style.display='none';
    ['hud','cbar','sbox'].forEach(id=>document.getElementById(id).style.opacity='1');
    document.getElementById('mode-btn').style.display='block';
    makeSprite();initC();initP(gW(),gH());
    initMic().then(()=>{try{initTones();}catch(e){}});
    if(manual)showManual();
    running=true;lastT=performance.now();
    requestAnimationFrame(loop);}

document.getElementById('go').addEventListener('click',start);
requestAnimationFrame(loop);
</script>
